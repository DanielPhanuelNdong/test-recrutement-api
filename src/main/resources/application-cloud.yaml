# Profil actif sur Cloud Run (SPRING_PROFILES_ACTIVE=cloud) pour se connecter à
# Cloud SQL via le Cloud SQL Java Connector (socket factory), sans IP publique ni
# gestion manuelle de certificats TLS : cf. README > CI/CD (GitHub Actions → GCP Cloud Run).
spring:
  datasource:
    url: jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
