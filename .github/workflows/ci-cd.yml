name: CI/CD

# Même découpage que le .gitlab-ci.yml de référence (build -> check/test -> package -> deploy),
# adapté à GitHub Actions et à une cible de déploiement GCP Cloud Run au lieu d'un VPS Docker Compose.
#
# - build   : compile le projet et publie le jar en artifact (équivalent de "build_project").
# - test    : exécute la suite de tests et publie le rapport JUnit (équivalent de "run_tests").
#             (Projet 100% Java sans linter configuré : pas d'équivalent direct à "lint_code" /
#             ktlintCheck de la référence Kotlin ; à réintroduire ici si un Checkstyle/PMD est ajouté.)
# - package : build & push de l'image Docker vers Artifact Registry (équivalent de "package").
# - deploy  : déploiement sur Cloud Run (équivalent du "deploy" SSH+docker compose sur VPS).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  GAR_LOCATION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REPOSITORY: task-manager
  IMAGE_NAME: task-manager-backend
  SERVICE_NAME: task-manager-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble
        run: ./gradlew assemble

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write # requis par mikepenz/action-junit-report pour publier le rapport JUnit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "build/test-results/test/**/TEST-*.xml"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test
          retention-days: 7

  package:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Alternative sans clé longue durée (recommandé) : remplacer credentials_json par
          #   workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          #   service_account: ${{ secrets.GCP_SA_EMAIL }}
          # cf. README > CI/CD pour la mise en place de la Workload Identity Federation.

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Compute image tag
        id: image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}"
          echo "base=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}" \
            -t "${{ steps.image.outputs.base }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.image }}"
          docker push "${{ steps.image.outputs.base }}:latest"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GAR_LOCATION }}
          image: ${{ needs.package.outputs.image }}
          # --add-cloudsql-instances monte le connecteur Cloud SQL pour l'instance ciblée ;
          # le SA de déploiement doit avoir le rôle roles/cloudsql.client (cf. README > CI/CD).
          flags: --allow-unauthenticated --port=8080 --min-instances=0 --max-instances=4 --memory=512Mi --add-cloudsql-instances=${{ vars.GCP_CLOUDSQL_INSTANCE }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=cloud
            INSTANCE_CONNECTION_NAME=${{ vars.GCP_CLOUDSQL_INSTANCE }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          secrets: |
            DB_PASSWORD=DB_PASSWORD:latest
            JWT_SECRET=JWT_SECRET:latest

      - name: Show deployed URL
        run: echo "Service déployé sur ${{ steps.deploy.outputs.url }}"
